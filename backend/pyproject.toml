[project]
name = "travel-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "openai>=1.40",
  "mcp>=1.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "asgi-lifespan>=2", "fakeredis>=2.23", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
