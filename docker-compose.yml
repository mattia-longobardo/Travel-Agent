services:

# Travel Redis # --------------------------------------------------------------------------------------------------------------

  travel-redis:
    image: redis:latest
    container_name: travel-redis
    user: "1000:1000"
    command: ["redis-server", "--save", "60", "1", "--dir", "/data"]
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - travel_internal

# Travel Backend # --------------------------------------------------------------------------------------------------------------

  travel-backend:
    build: ./backend
    image: travel-backend:latest
    container_name: travel-backend
    user: "1000:1000"
    depends_on:
      travel-redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_TRAVEL_PASSWORD: ${DB_TRAVEL_PASSWORD}
      # DB migrato sul postgres condiviso dello stack db/ (rete db_internal).
      # Dipendenza cross-stack: niente depends_on, ci pensano restart + healthcheck.
      POSTGRES_HOST: postgres
      REDIS_HOST: travel-redis
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      LASTMINUTE_MCP_URL: ${LASTMINUTE_MCP_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      TZ: ${TZ}
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.travel-backend-router.rule=Host(`${TRAVEL_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.travel-backend-router.entrypoints=web"
      - "traefik.http.services.travel-backend-service.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.travel-backend-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.travel-backend-router.middlewares=travel-backend-https"
    networks:
      - proxy_public
      - travel_internal
      - db_internal

# Travel Frontend # --------------------------------------------------------------------------------------------------------------

  travel-frontend:
    build: ./frontend
    image: travel-frontend:latest
    container_name: travel-frontend
    user: "1000:1000"
    depends_on:
      - travel-backend
    environment:
      BACKEND_URL: http://travel-backend:8000
      TZ: ${TZ}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.travel-frontend-router.rule=Host(`${TRAVEL_HOST}`)"
      - "traefik.http.routers.travel-frontend-router.entrypoints=web"
      - "traefik.http.services.travel-frontend-service.loadbalancer.server.port=3000"
    networks:
      - proxy_public
      - travel_internal

networks:
  proxy_public:
    external: true
  db_internal:
    external: true
  travel_internal:
    name: travel_internal
